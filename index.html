<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>[FULL_NAME] | [PROFESSIONAL_TITLE]</title>
    <meta name="title" content="[FULL_NAME] | [PROFESSIONAL_TITLE]" />
    <meta
      name="description"
      content="[SHORT_TAGLINE] — Portfolio of [FULL_NAME], a [PROFESSIONAL_TITLE] based in [LOCATION]."
    />
    <meta name="keywords" content="portfolio, developer, software engineer, [PROFESSIONAL_TITLE]" />
    <meta name="author" content="[FULL_NAME]" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="[PORTFOLIO_URL]" />
    <meta property="og:title" content="[FULL_NAME] | [PROFESSIONAL_TITLE]" />
    <meta
      property="og:description"
      content="[SHORT_TAGLINE] — Portfolio of [FULL_NAME], a [PROFESSIONAL_TITLE] based in [LOCATION]."
    />
    <meta property="og:image" content="[PORTFOLIO_URL]/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="[PORTFOLIO_URL]" />
    <meta property="twitter:title" content="[FULL_NAME] | [PROFESSIONAL_TITLE]" />
    <meta
      property="twitter:description"
      content="[SHORT_TAGLINE] — Portfolio of [FULL_NAME], a [PROFESSIONAL_TITLE] based in [LOCATION]."
    />
    <meta property="twitter:image" content="[PORTFOLIO_URL]/og-image.png" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
